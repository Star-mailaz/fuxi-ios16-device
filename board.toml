"schema_version" = 2

# Xiaomi 13 (fuxi, SM8550) under the UniXNU format-2 layering:
#   profiles/arch/arm64 -> UniXNU-sm8550-common (soc) -> profiles/os/ios-16.7.16-20H392 -> this file.
# Arrays replace inherited arrays, so the component list below is the complete GPU-free set:
# it drops Adreno740, AdrenoMetal, AdrenoPM4, AdrenoFirmware, ArmSmmu4K and Sm8550Platform
# (ShengGmu/ShengGpuSmmu) that UniXNU-sm8550-common/soc.toml inherits. Selecting the GPU path
# later means switching to a component list that names them, not editing sources.

["board"]
"name" = "fuxi"
"soc" = "SM8550"
"description" = "Xiaomi 13"
"kit" = "fuxi"
"soc_source" = "sm8550"
"os_profile" = "ios-16.7.16-20H392"


["userdata"]
"first_lba" = 3110976
"last_lba" = 61850618
"lba_bytes" = 4096
"windows" = [{ "name" = "OS", "component" = "OS" }, { "name" = "SystemOS", "component" = "Cryptex1,SystemOS" }]


["kernel"]
"defconfig" = "fuxi_softrender_defconfig"
# Archive builders of the kernel step, in order. Bring-up list, sheng's set minus the parts
# that cannot be qualified against this board's OS image:
#   build-sheng-platform-power.py   sheng PMGR power domains, no fuxi port
#   build-boot-progress.py          its guard requires the audited UFS/owner-root and virtio build
#   build-native-legacy-display.py  the CPU presentation archive (GopFramebuffer's
#                                   NativeLegacyDisplay + NativeGOPresenter wired into this
#                                   device). Not wired yet: it runs
#                                   scripts/audit-mobile-graphics-legacy.py, which the UniXNU
#                                   mainline carries as a pin on the *sheng iPadOS 17.7.11*
#                                   kernelcache. That audit wants
#                                   build/xnu-prelink/native-owner-mobile-graphics-candidate.macho
#                                   and rejects a candidate whose IOMobileGraphicsFamily
#                                   __TEXT_EXEC sha256 is not 2e044ee6...f9bd9b; the builder
#                                   then binds 17.7.11 addresses (Legacy ctor and gMetaClass,
#                                   the IOSurface getters, the vsync sender, slots 249/295/296/301)
#                                   on a 358-slot vtable and a 0x18a0-byte instance. The 16.7.16
#                                   (20H392) image this board prelinks is a different class ABI:
#                                   338 legacy slots against 358, base pair 252 against 262,
#                                   abstract leaves [211,212,242,243,292,293,321,322,329], and a
#                                   different family __TEXT_EXEC sha256. Re-pinning is a
#                                   re-derivation from that binary, not a hash edit. The pins, the
#                                   derived 16.7.16 values and the inputs still missing are in
#                                   scripts/DISPLAY-ABI.md; scripts/check-display-abi-inputs.py
#                                   verifies the part the pinned kernelcache alone can answer.
#   component:Adreno740             the GPU path this profile exists to leave out
# corecrypto is built from source because ArmCpu requires the real source provider, and because
# the first boot died in _SHA512_Init (far 0x40) with the prelinked callers from the 16.7.16
# kernelcache: CONFIG_XNU_CRYPTO_BOOTSTRAP="source" keeps every crypto call on one implementation.
"archives" = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
# build-fuxi-stub.py defines, weakly, the native symbols the XNU patches reference even when
# their feature is off. Without it the link stops on native_legacy_display_probe,
# boot_progress_poll, the verified-root chain and mockfs.
  "build-fuxi-stub.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]
# Config fragments come from all three shared layers: they are CONFIG_XNU_* names, not code.
"config_fragments" = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ios.config"]
# The patch series is the device one alone. Arrays replace inherited arrays, and the arch/soc/os
# series are written for xnu-10063.141.1 (iPadOS 17): against the 8796.141.3 base this device
# builds on, 13 of their 59 patches do not apply, 38 of them touch files the sweet series also
# touches (bsd_init.c, KernelConfigTables.cpp, start.s, kern_exec.c), and the page size is
# mutually exclusive -- SWEET.h defines __ARM_16K_PG__ where unixnu's native-4k-* patches take the
# !__ARM_16K_PG__ branch of the same vm_map_set_page_shift. So this is not a merge candidate: the
# sweet series plus fuxi's own is the combination that has run to a SpringBoard on hardware, and
# patches/xnu/series carries its provenance. Reaching for the 10063 layer means a different OS
# profile and a re-derived kernel, not a wider list here.
"patch_series" = ["device:patches/xnu/series"]


["firmware"]
"config" = "fuxi"
"dsc" = "Platforms/Xiaomi/fuxiPkg/fuxi.dsc"
"fd" = "Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
"submodules" = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
"patches" = ["Resources/MuPatches/Gic-Spurious.patch"]
"packages" = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

["firmware"."defines"]
"ENABLE_SECUREBOOT" = "1"
"DEVICE_MODEL" = "fuxi"
"MEMORY_PROTECTION" = "TRUE"
"SHIP_MODE" = "FALSE"
"BUILDID_STRING" = "fuxi-research"


["payload"]
"volume" = "FUXIESP"
"size_mib" = 192
"loader" = "firmware"
"title" = "fuxi: iPhone X iOS 16.7.16"
"dram_size" = "0x80000000"
"panic_screen" = true
"trust_cache_sha256" = [
  "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b",
  "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361",
]
# The CPU presentation path: offline-legacy-gop, -transfer and -cpu-present make the legacy
# display provider copy the composed surface into the GOP buffer itself. The sheng GPU
# presentation arguments (sheng-fb-gpu, sheng-gpu-metal, sheng-gpu-power, sheng-gpu-dcvs,
# sheng-gpu-addon) are absent by design.
"kernel_args" = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "armcpu-diagnostics=1",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]
# native-ufs-root=1 is left out: the payload builder requires a PMGR driver for it
# ("native UFS root boot needs exactly one sheng-pmgr=2; the unchanged target AMFI
# otherwise panics with No PMGR"), and the only PMGR archive in the tree is sheng's
# board table. Until fuxi has its own, the root volume comes from the mockfs fixture and
# XNU still boots far enough to print its console banner.

["payload"."adt"]
"chip_id" = "207"
"owned_memory_size" = "0x130000000"
"root_match_volume_uuid" = "DADD93F8-DBBF-4B17-A1DF-0F11E64172F7"
"packed_data_ramdisk" = true
"unique_chip_id" = "0123456789ABCDEF"


# fuxi's stock device tree already declares /reserved-memory/splash_region, so no
# bootimg.dtb_node is added.

["device_tree"]
"source" = "device:dts/fuxi.dts"
"include_dirs" = ["soc:dts"]


# GPU-free component set. Every entry is a component of components.toml; GopFramebuffer is
# the CPU presentation path (PE_current_console -> GOP buffer) that the legacy display
# archive plugs into. Storage is parked: fuxi_softrender_defconfig keeps CONFIG_XNU_NATIVE_UFS
# off because the storage classes collide with the prelinked IOStorageFamily kext, and the
# mockfs fixture supplies the root volume instead.
#
# One imprecision to know about: ShengHidInput's dependency list brings in ShengNovatekTouch,
# which is sheng's Novatek panel and not fuxi's touch controller. It is an embedded-stage board
# driver, so it does not change the GPU-free property, but fuxi needs its own touch component
# before touch is anything more than "the kernel queues events". Recorded here rather than
# silently inherited.
["components"]
"include" = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "GopFramebuffer", "ShengHidInput", "AppleKeyStoreState", "XnuPrelink", "DarwinBoot"]


["adt"]

["adt"."buttons"]

["adt"."buttons"."string"]
"compatible" = "buttons"
"device_type" = "buttons"

["adt"."buttons"."strings"]
"button-names" = ["hold", "voldown", "volup"]

["adt"."buttons"."u32"]
"home-button-type" = 2


["adt"."defaults"]

["adt"."defaults"."u32"]
"sleep-disabled" = 1
