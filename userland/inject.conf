# Programs that are started with one of our libraries inside them: "LIBRARY PROGRAM..." per
# line, one library per line, as HakiOS's INJECT table does (userland/build.sh, MIT, see
# NOTICE.md). The two libraries below are what this repository builds for the software-render
# profile:
#
#   libFuxiSoftRender.dylib            fuxi_soft_render.c   -- the window server and the
#                                                             container managers
#   libFuxiSpringBoardSoft.dylib       fuxi_springboard_soft.c + fuxi_activation.c -- SpringBoard
#                                      (vibrant views, snapshots; activation and the setup assistant)
#
# There is no OpenGL ES library, no media library, no tweak loader and no Metal bridge here: the
# GPU profile would name them, and this file is the CPU profile's table.
#
# installed as /fuxi/lib/... in the payload volume; the path is the payload's, not the host's.
/fuxi/lib/libFuxiSoftRender.dylib backboardd containermanagerd containermanagerd_system
/fuxi/lib/libFuxiSpringBoardSoft.dylib SpringBoard
